<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">

    <style>
      @font-face {
        font-family: "kosugi";
        src: url("Kosugi.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "kosugi";
        src: url("en1.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        unicode-range: U+0020-007E;
      }
      body {
        background: rgb(250,250,220);
        margin: 0;
        color: rgb(0,0,0);
        touch-action: manipulation;
      }
      .push {
        cursor: pointer;
      }
      .off {
        display: none !important;
      }
      .notclick {
        pointer-events: none;
        cursor: default !important;
      }
      .all {
        position: relative;
        background: rgb(255,255,230);
        margin: 0 auto;
        height: 100svh;
        aspect-ratio: 5 / 8;
        max-width: 100vw;
        color: rgb(0,0,0);
      }
      .number,
      .mondai1,
      .mondai2 {
        font-family: kosugi, sans-serif;
        white-space: nowrap;
      }
      .menu {
        position: absolute;
        left: 1%;
        top: 1%;
        width: 7%;
        aspect-ratio: 1 / 1;
        background: rgba(0,0,0,0);
        border: none;
        z-index: 4;
      }
      .me1,
      .me2,
      .me3 {
        position: absolute;
        width: 100%;
        height: 28%;
        left: 0;
        background: rgb(150,150,150);
      }
      .me1 {
        top: 0;
      }
      .me2 {
        top: 36%;
      }
      .me3 {
        top: 72%;
      }
      .menuG {
        position: absolute;
        left: 0;
        height: 100svh;
        aspect-ratio: 5 / 8;
        max-width: 100vw;
        background: rgb(230,230,230);
        z-index: 3;
        opacity: 1;
        transition: left 0.6s, opacity 0.8s, visibility 0.8s;
        color: rgb(0,0,0);
        font-family: kosugi, sans-serif;
        visibility: visible;
      }
      .menuGkakusi {
        position: absolute;
        height: 100svh;
        aspect-ratio: 5 / 8;
        max-width: 100vw;
        background: rgb(250,250,220);
        left: -100%;
        z-index: 4;
      }
      .menuG.slide {
        visibility: hidden;
        left: -100%;
        opacity: 0;
      }
      .number {
        position: absolute;
        right: 3%;
        font-size: 160%;
      }
      .mondai1 {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 9%;
        font-size: 151%;
      }
      .mondai2 {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 15%;
        font-size: 151%;
      }
      .options {
        position: absolute;
        top: 28%;
        width: 100%;
        height: 70%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .resultG {
        position: absolute;
        top: 28%;
        width: 100%;
        height: 56%;
        background: rgb(255,255,230);
      }
      .o1,
      .o2,
      .o3,
      .o4,
      .buttons {
        position: relative;
        display: flex;
        border: none;
        width: 94%;
        height: 18%;
        margin: 0 3%;
        border-radius: 10px;
      }
      .o1,
      .o2,
      .o3,
      .o4 {
        background: rgb(120,200,120);
      }
      .o1m,
      .o2m,
      .o3m,
      .o4m {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: rgb(255,255,255);
        font-weight: 900;
        font-size: 180%;
        white-space: nowrap;
        font-family: kosugi, sans-serif;
      }
      .bback {
        background: rgb(100,180,200);
      }
      .mback {
        background: rgb(240, 160, 170);
      }
      .buttons {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      .next,
      .miss {
        display: flex;
        border: none;
        width: 47%;
        height: 100%;
        justify-content: center;
        align-items: center;
        color: rgb(255,255,255);
        font-weight: 900;
        border-radius: 10px;
        font-family: kosugi, sans-serif;
        z-index: 1;
        white-space: nowrap;
      }
      .next {
        font-size: 150%;
        white-space: nowrap;
        background: rgb(120,200,120);
      }
      .miss {
        background: rgb(240,180,80);
        font-size: 130%;
      }
      .maru,
      .batu {
        position: absolute;
        right: 3%;
        z-index: 1;
        top: 50%;
        transform: translateY(-50%);
        width: 12%;
      }
      .linka {
        position: absolute;
        left: 2%;
        bottom: 1%;
      }
      .ratem {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -200%);
        font-size: 180%;
        white-space: nowrap;
      }
      .timem {

        left: 50%;
        top: 50%;

        white-space: nowrap;

      .rangeset {

        top: 10%;

        height: 25%;
        background: rgb(180,230,230);
        border-radius: 15px;

      .range_select,

      }
      .range_start,

      .range_end,

        top: 60%;

        background: rgb(250,250,200);
        border-radius: 10px;
        font-size: 110%;
        text-align: center;
      }
      .bo {
        position: absolute;
        left: 45.5%;
        top: 57%;
        font-size: 140%;
      }
      .changeset {
        position: absolute;
        left: 5%;
        top: 75%;
        width: 40%;
        height: 12%;
        background: rgb(250,250,200);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .changem{
        position: absolute;
        right: 10%;
        top: -21%;
        width: 44%;
        height: 41%;
        background: rgb(250,250,200);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .changem::after {
        content: "問題形式";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%) rotate(0deg);
        white-space: nowrap;
      }
      .mondaisuset {
        position: absolute;
        right: 5%;
        top: 75%;
        width: 45%;
        height: 12%;
        background: rgb(250,200,200);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .mondaisum{
        position: absolute;
        right: 10%;
        top: -21%;
        width: 33%;
        height: 41%;
        background: rgb(250,200,200);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .mondaisum::after {
        content: "問題数";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%) rotate(0deg);
        white-space: nowrap;
      }
      .mondaisu {
        position: absolute;
        width: 30%;
        height: 33%;
        left: 23%;
        top: 37%;
        border: none;
        background: rgb(250,250,200);
        border-radius: 10px;
        font-size: 110%;
        text-align: center;
      }
      .mon {
        position: absolute;
        left: 60%;
        top: 40%;
        font-size: 130%;
      }
      .change{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -30%);
        width: 20%;
        aspect-ratio: 1 / 1;
        background: rgb(230,230,230);
        transition: transform 0.3s, filter 0.3s;
      }
      .switch1 {
        transform: translate(-50%,-30%) rotate(180deg);
        filter: invert(100%);
      }
      .niti {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-220%, -32%);
        font-size: 170%;
        font-weight: bold;
      }
      .ei {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(110%, -32%);
        font-size: 170%;
        font-weight: bold;
      }
      .keika {
        position: absolute;
        font-size: 160%;
        white-space: nowrap;
        right: 15%;
        bottom: 5.5%;
        font-family: 'kosugi';
      }
    </style>
  </head>

    <script>
      const all = document.querySelector('.all');
      const range_start = document.querySelector('.range_start');
      const range_end = document.querySelector('.range_end');
      const option_start = document.querySelector('.option_start');
      const option_end = document.querySelector('.option_end');
      const number = document.querySelector('.number');
      const mondai1 = document.querySelector('.mondai1');
      const mondai2 = document.querySelector('.mondai2');
      const o1 = document.querySelector('.o1');
      const o2 = document.querySelector('.o2');
      const o3 = document.querySelector('.o3');
      const o4 = document.querySelector('.o4');
      const o1m = document.querySelector('.o1m');
      const o2m = document.querySelector('.o2m');
      const o3m = document.querySelector('.o3m');
      const o4m = document.querySelector('.o4m');
      const menu = document.querySelector('.menu');
      const menuG = document.querySelector('.menuG');
      const next = document.querySelector('.next');
      const miss = document.querySelector('.miss');
      const m1 = document.querySelector('.m1');
      const m2 = document.querySelector('.m2');
      const m3 = document.querySelector('.m3');
      const m4 = document.querySelector('.m4');
      const b1 = document.querySelector('.b1');
      const b2 = document.querySelector('.b2');
      const b3 = document.querySelector('.b3');
      const b4 = document.querySelector('.b4');
      const change = document.querySelector('.change');
      let question_words = [];
      let option_words = [];
      let mistakes_words = [];
      let mistakes_quantity = 0;
      let question_number = 0;
      let answer_number = 0;
      let option_number = 0;
      let question_range = 0;
      let option_range = 0;
      let o1text = "";
      let o2text = "";
      let o3text = "";
      let o4text = "";
      let o1imi = "";
      let o2imi = "";
      let o3imi = "";
      let o4imi = "";
      range_start.value = 1;
      range_end.value = words.length;
      option_start.value = 1;
      option_end.value = words.length;
      let old_range_start = range_start.value;
      let old_range_end = range_end.value;
      let old_option_start = option_start.value;
      let old_option_end = option_end.value;
      let change_number = 1;
      let m = 0;
      const resultG = document.querySelector(".resultG");
      const ratem = document.querySelector(".ratem");
      const timem = document.querySelector(".timem");
      let answered_number = 0;
      let rate = 0;
      const range_select = document.querySelector(".range_select");
      const option_select = document.querySelector(".option_select");
      const mondaisu = document.querySelector(".mondaisu");
      const keika = document.querySelector(".keika");
      mondaisu.value = words.length;
      let old_mondaisu = mondaisu.value;
      let nom = 0;
      const saved = JSON.parse(localStorage.getItem("data") || "{}");
      let startTime = null;
      let endTime = null;
      let elapsed = 0;
      let seconds = 0;
      let minutes = 0;
      function startTimer() {
        startTime = Date.now();
      }
      function endTimer() {
        endTime = Date.now();
        elapsed = endTime - startTime;
        seconds = Math.floor(elapsed / 1000);
        minutes = Math.floor(seconds / 60);
      }
      
      range_select.selectedIndex = Number(saved.d1) ?? 0;
      option_select.selectedIndex = Number(saved.d6) ?? 0;
      range_start.value = Number(saved.d2) || 1;
      old_range_start = Number(saved.d3) || range_start.value;
      range_end.value = Number(saved.d4) || words.length;
      old_range_end = Number(saved.d5) || range_end.value;
      option_start.value = Number(saved.d7) || 1;
      old_option_start = Number(saved.d8) || option_start.value;
      option_end.value = Number(saved.d9) || words.length;
      old_option_end = Number(saved.d10) || option_end.value;
      if ((saved.d11 === true || saved.d11 === "true")) {
        change.classList.add("switch1");
      } else {
        change.classList.remove("switch1");
      }
      mondaisu.value = Number(saved.d12) || words.length;
      old_mondaisu = Number(saved.d13) || mondaisu.value;
      change_number = Number(saved.d14) || 1;

      function savedata() {
        const data = {
          d1: range_select.selectedIndex,
          d2: range_start.value,
          d3: old_range_start,
          d4: range_end.value,
          d5: old_range_end,
          d6: option_select.selectedIndex,
          d7: option_start.value,
          d8: old_option_start,
          d9: option_end.value,
          d10: old_option_end,
          d11: change.classList.contains("switch1"),
          d12: mondaisu.value,
          d13: old_mondaisu,
          d14: change_number
        };
        localStorage.setItem("data", JSON.stringify(data));
      }
      function fontsize(l) {
        if (l.length < 14) {
          return "180%";
        } else if (l.length < 16) {
          return "160%";
        } else {
          return "117%";
        }
      }
      function setquestion() {
        resultG.classList.add("off");
        question_number = Math.floor(Math.random() * question_words.length);
        number.textContent = question_words[question_number][0];
        if (change.classList.contains("switch1")) {
          mondai1.style.fontSize = "200%";
          mondai1.textContent = question_words[question_number][1];
          mondai2.textContent = "";
        } else {
          if (question_words[question_number][2].length > question_words[question_number][3].length) {
            mondai1.style.fontSize = fontsize(question_words[question_number][2]);
            mondai2.style.fontSize = fontsize(question_words[question_number][2]);
          } else if (question_words[question_number][2].length < question_words[question_number][3].length) {
            mondai1.style.fontSize = fontsize(question_words[question_number][3]);
            mondai2.style.fontSize = fontsize(question_words[question_number][3]);
          } else {
            mondai1.style.fontSize = fontsize(question_words[question_number][2]);
            mondai2.style.fontSize = fontsize(question_words[question_number][3]);
          }
          mondai1.textContent = "① " + question_words[question_number][2];
          if (question_words[question_number][3] === "") {
            mondai2.textContent = "";
          } else {
            mondai2.textContent = "② " + question_words[question_number][3];
          }
        }
        answer_number = Math.floor(Math.random() * 4);
        switch (answer_number) {
          case 0:
            o1text = question_words[question_number][change_number];
            if (change_number === 1) o1imi = question_words[question_number][2];
            option_number = Math.floor(Math.random() * option_words.length);
            o2text = option_words[option_number][change_number];
            if (change_number === 1) {
              o2imi = option_words[option_number][2];
            }
            while (change_number === 1 ? (o2text === o1text && o2imi === o1imi) : o2text === o1text) {
              option_number = Math.floor(Math.random() * option_words.length);
