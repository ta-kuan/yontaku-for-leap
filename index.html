<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>4択 For-LEAP</title>
    <link rel="icon" href="tubicon.png">
    <style>
      @font-face {
        font-family: "kosugi";
        src: url("Kosugi.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "en";
        src: url("english.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      body {
        background: rgb(250,250,220);
        margin: 0;
        color: rgb(0,0,0);
      }
      .off {
        display: none !important;
      }
      .notclick {
        pointer-events: none;
      }
      .all {
        position: relative;
        background: rgb(255,255,230);
        margin: 0 auto;
        height: 100svh;
        aspect-ratio: 5 / 8;
        max-width: 100vw;
        color: rgb(0,0,0);
      }
      .number,
      .mondai1,
      .mondai2 {
        font-family: kosugi, sans-serif;
        white-space: nowrap;
      }
      .menu {
        position: absolute;
        left: 1%;
        top: 1%;
        width: 7%;
        aspect-ratio: 1 / 1;
        background: rgba(0,0,0,0);
        border: none;
        z-index: 3;
      }
      .me1,
      .me2,
      .me3 {
        position: absolute;
        width: 100%;
        height: 28%;
        left: 0;
        background: rgb(150,150,150);
      }
      .me1 {
        top: 0;
      }
      .me2 {
        top: 36%;
      }
      .me3 {
        top: 72%;
      }
      .menuG {
        position: absolute;
        left: 0;
        height: 100svh;
        aspect-ratio: 5 / 8;
        max-width: 100vw;
        background: rgb(230,230,230);
        z-index: 2;
        opacity: 1;
        transition: left 0.6s, opacity 0.8s;
        color: rgb(0,0,0);
      }
      .menuGkakusi {
        position: absolute;
        height: 100svh;
        aspect-ratio: 5 / 8;
        max-width: 100vw;
        background: rgb(250,250,220);
        left: -100%;
        z-index: 3;
      }
      .menuG.slide {
        left: -100%;
        opacity: 0;
      }
      .number {
        position: absolute;
        right: 3%;
        font-size: 160%;
      }
      .mondai1 {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 9%;
        font-size: 160%;
      }
      .mondai2 {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 15%;
        font-size: 160%;
      }
      .options {
        position: absolute;
        top: 28%;
        width: 100%;
        height: 70%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .resultG {
        position: absolute;
        top: 28%;
        width: 100%;
        height: 56%;
        background: rgb(255,255,230);
      }
      .o1,
      .o2,
      .o3,
      .o4,
      .buttons {
        position: relative;
        display: flex;
        border: none;
        width: 94%;
        height: 18%;
        margin: 0 3%;
        border-radius: 10px;
      }
      .o1,
      .o2,
      .o3,
      .o4 {
        background: rgb(120,200,120);
      }
      .o1m,
      .o2m,
      .o3m,
      .o4m {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: rgb(255,255,255);
        font-weight: 900;
        font-size: 200%;
        white-space: nowrap;
      }
      .bback {
        background: rgb(100,180,200);
      }
      .mback {
        background: rgb(240, 160, 170);
      }
      .buttons {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      .next,
      .miss {
        display: flex;
        border: none;
        width: 47%;
        height: 100%;
        justify-content: center;
        align-items: center;
        color: rgb(255,255,255);
        font-weight: 900;
        border-radius: 10px;
        font-family: kosugi, sans-serif;
      }
      .next {
        font-size: 150%;
        white-space: nowrap;
        background: rgb(120,200,120);
      }
      .miss {
        background: rgb(240,180,80);
        font-size: 130%;
      }
      .maru,
      .batu {
        position: absolute;
        right: 3%;
        z-index: 1;
        top: 50%;
        transform: translateY(-50%);
        width: 12%;
      }
      .linka {
        position: absolute;
        left: 2%;
        bottom: 1%;
      }
      .ratem {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -30%);
        font-size: 180%;
      }
      .rangeset {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 10%;
        width: 90%;
        height: 25%;
        background: rgb(180,230,230);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .rangem{
        position: absolute;
        right: 10%;
        top: -10%;
        width: 25%;
        height: 20%;
        background: rgb(180,230,230);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .rangem::after {
        content: "出題範囲";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%);
        white-space: nowrap;
      }
      .optionset {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 43%;
        width: 90%;
        height: 25%;
        background: rgb(190,230,190);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .optionm{
        position: absolute;
        right: 7%;
        top: -10%;
        width: 31%;
        height: 20%;
        background: rgb(190,230,150);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .optionm::after {
        content: "選択肢範囲";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%);
        white-space: nowrap;
      }
      .range_select,
      .option_select {
        position: absolute;
        width: 40%;
        height: 20%;
        left: 10%;
        top: 15%;
        border: none;
        background: rgb(250,250,200);
        border-radius: 10px;
        font-size: 120%;
        text-align: center;
      }
      .range_start,
      .option_start {
        position: absolute;
        width: 17%;
        height: 17%;
        left: 25%;
        top: 60%;
        border: none;
        background: rgb(250,250,200);
        border-radius: 10px;
        font-size: 110%;
        text-align: center;
      }
      .range_end,
      .option_end {
        position: absolute;
        width: 17%;
        height: 17%;
        left: 55%;
        top: 60%;
        border: none;
        background: rgb(250,250,200);
        border-radius: 10px;
        font-size: 110%;
        text-align: center;
      }
      .bo {
        position: absolute;
        left: 45.5%;
        top: 57%;
        font-size: 140%;
      }
      .changeset {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 75%;
        width: 90%;
        height: 12%;
        background: rgb(250,250,200);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .changem{
        position: absolute;
        right: 10%;
        top: -21%;
        width: 25%;
        height: 41%;
        background: rgb(250,250,200);
        border-radius: 15px;
        border: solid 2px rgb(100,100,100);
      }
      .changem::after {
        content: "問題形式";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%) rotate(0deg);
        white-space: nowrap;
      }
      .change{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -30%);
        width: 30px;
        height: 30px;
        background: rgb(230,230,230);
        border: none;
        transition: transform 0.3s;
        margin: 0;
        font-size: 150%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 0 1% 0;
      }
      .switch1 {
        transform: translate(-50%,-30%) rotate(180deg);
      }
      .niti {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-220%, -38%);
        font-size: 170%;
        font-weight: bold;
      }
      .ei {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(110%, -38%);
        font-size: 170%;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="all">
      <button class="menu">
        <div class="me1"></div>
        <div class="me2"></div>
        <div class="me3"></div>
      </button>
      <div class="menuG slide">
        <div class="rangeset">
          <div class="rangem"></div>
          <select class="range_select">
            <option>ALL</option>

            <option>P2:Week3</option>

          <select class="option_select">
            <option>ALL</option>

            <option>P1:Week6</option>
            <option>P1:Week7</option>

          </select>
          <input name="menu_input" type="number" class="option_start">

        <a href="https://for-leap.pages.dev/" class="linka">For-LEAP</a>

      <div class="number"></div>
      <div class="mondai1"></div>
      <div class="mondai2"></div>
      <div class="options">
        <button class="o1" id="o1i">
          <span class="o1m"></span>
          <img src="maru.png" for="o1i" class="maru m1 off">
          <img src="batu.png" for="o1i" class="batu b1 off">
        </button>
        <button class="o2" id="o2i">
          <span class="o2m"></span>
          <img src="maru.png" for="o2i" class="maru m2 off">
          <img src="batu.png" for="o2i" class="batu b2 off">
        </button>
        <button class="o3" id="o3i">
          <span class="o3m"></span>
          <img src="maru.png" for="o3i" class="maru m3 off">
          <img src="batu.png" for="o3i" class="batu b3 off">
        </button>
        <button class="o4" id="o4i">
          <span class="o4m"></span>
          <img src="maru.png" for="o4i" class="maru m4 off">

    <script src="words.js"></script>
    <script>
      const all = document.querySelector('.all');
      const range_start = document.querySelector('.range_start');
      const range_end = document.querySelector('.range_end');
      const option_start = document.querySelector('.option_start');
      const option_end = document.querySelector('.option_end');
      const number = document.querySelector('.number');
      const mondai1 = document.querySelector('.mondai1');
      const mondai2 = document.querySelector('.mondai2');
      const o1 = document.querySelector('.o1');
      const o2 = document.querySelector('.o2');
      const o3 = document.querySelector('.o3');
      const o4 = document.querySelector('.o4');
      const o1m = document.querySelector('.o1m');
      const o2m = document.querySelector('.o2m');
      const o3m = document.querySelector('.o3m');
      const o4m = document.querySelector('.o4m');
      const menu = document.querySelector('.menu');
      const menuG = document.querySelector('.menuG');
      const next = document.querySelector('.next');
      const miss = document.querySelector('.miss');
      const m1 = document.querySelector('.m1');
      const m2 = document.querySelector('.m2');
      const m3 = document.querySelector('.m3');
      const m4 = document.querySelector('.m4');
      const b1 = document.querySelector('.b1');
      const b2 = document.querySelector('.b2');
      const b3 = document.querySelector('.b3');
      const b4 = document.querySelector('.b4');
      const change = document.querySelector('.change');
      let question_words = [];
      let option_words = [];
      let mistakes_words = [];
      let mistakes_quantity = 0;
      let question_number = 0;
      let answer_number = 0;
      let option_number = 0;
      let question_range = 0;
      let option_range = 0;
      let o1text = "";
      let o2text = "";
      let o3text = "";
      let o4text = "";
      range_start.value = 1;
      range_end.value = 400;
      option_start.value = 1;
      option_end.value = 400;
      let old_range_start = range_start.value;
      let old_range_end = range_end.value;
      let old_option_start = option_start.value;
      let old_option_end = option_end.value;
      let change_number = 1;
      let m = 0;
      const resultG = document.querySelector(".resultG");
      const ratem = document.querySelector(".ratem");
      let answered_number = 0;
      let rate = 0;
      const range_select = document.querySelector(".range_select");
      const option_select = document.querySelector(".option_select");
      
      function setquestion() {
        resultG.classList.add("off");
        question_number = Math.floor(Math.random() * question_words.length);
        number.textContent = question_words[question_number][0];
        if (change.classList.contains("switch1")) {
          mondai1.textContent = question_words[question_number][1];
          mondai2.textContent = "";
        } else {
          mondai1.textContent = "① " + question_words[question_number][2];
          if (question_words[question_number][3] === "") {
            mondai2.textContent = question_words[question_number][3];
          } else {
            mondai2.textContent = "② " + question_words[question_number][3];
          }
        }
        answer_number = Math.floor(Math.random() * 4);
        switch (answer_number) {
          case 0:
            o1text = question_words[question_number][change_number];
            option_number = Math.floor(Math.random() * option_words.length);
            o2text = option_words[option_number][change_number];
            while (o2text === o1text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o2text = option_words[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_words.length);
            o3text = option_words[option_number][change_number];
            while (o3text === o1text || o3text === o2text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o3text = option_words[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_words.length);
            o4text = option_words[option_number][change_number];
            while (o4text === o1text || o4text === o2text || o4text === o3text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o4text = option_words[option_number][change_number];
            }
            m = 1;
            break;
          case 1:
            o2text = question_words[question_number][change_number];
            option_number = Math.floor(Math.random() * option_words.length);
            o1text = option_words[option_number][change_number];
            while (o1text === o2text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o1text = option_words[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_words.length);
            o3text = option_words[option_number][change_number];
            while (o3text === o1text || o3text === o2text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o3text = option_words[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_words.length);
            o4text = option_words[option_number][change_number];
            while (o4text === o1text || o4text === o2text || o4text === o3text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o4text = option_words[option_number][change_number];
            }
            m = 2;
            break;
          case 2:
            o3text = question_words[question_number][change_number];
            option_number = Math.floor(Math.random() * option_words.length);
            o1text = option_words[option_number][change_number];
            while (o1text === o3text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o1text = option_words[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_words.length);
            o2text = option_words[option_number][change_number];
            while (o2text === o1text || o2text === o3text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o2text = option_words[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_words.length);
            o4text = option_words[option_number][change_number];
            while (o4text === o1text || o4text === o2text || o4text === o3text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o4text = option_words[option_number][change_number];
            }
            m = 3;
            break;
          case 3:
            o4text = question_words[question_number][change_number];
            option_number = Math.floor(Math.random() * option_words.length);
            o1text = option_words[option_number][change_number];
            while (o1text === o4text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o1text = option_words[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_words.length);
            o2text = option_words[option_number][change_number];
            while (o2text === o1text || o2text === o4text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o2text = option_words[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_words.length);
            o3text = option_words[option_number][change_number];
            while (o3text === o1text || o3text === o2text || o3text === o4text) {
              option_number = Math.floor(Math.random() * option_words.length);
              o3text = option_words[option_number][change_number];
            }
            m = 4;
            break;
        }
        o1m.textContent = o1text;
        o2m.textContent = o2text;
        o3m.textContent = o3text;
        o4m.textContent = o4text;
        next.classList.add("notclick");
      }
      function startquestion() {
        question_words = [];
        option_words = [];
        question_range = Number(range_end.value) - Number(range_start.value) + 1;
        for (let i = 0;i < question_range;i ++) {
          question_words[i] = words[Number(range_start.value) + i - 1];
        }
        option_range = Number(option_end.value) - Number(option_start.value) + 1;
        for (let i = 0;i < option_range;i ++) {
          option_words[i] = words[Number(option_start.value) + i - 1];
        }
        mistakes_words = [];
        mistakes_quantity = 0;
        answered_number = 0;
        setquestion();
      }
      function setmaru() {
        switch(m) {
          case 1:
            m1.classList.remove("off");
            o1.classList.add("mback");
            break;
          case 2:
            m2.classList.remove("off");
            o2.classList.add("mback");
            break;
          case 3:
            m3.classList.remove("off");
            o3.classList.add("mback");
            break;
          case 4:
            m4.classList.remove("off");
            o4.classList.add("mback");
            break;
        }
      }
      menu.addEventListener('click', () => {
        menuG.classList.toggle("slide");
      });
      range_start.addEventListener('change', (event) => {
        if (range_start.value <= 0 || range_start.value > words.length) {
          range_start.value = old_range_start;
          alert("1~"+words.length+"の値にしてください");
        } else {
          old_range_start = range_start.value;
          answered_number = 0;
          startquestion();
        }
      });
      range_end.addEventListener('change', (event) => {
        if (range_end.value <= 0 || range_end.value > words.length) {
          range_end.value = old_range_end;
          alert("1~"+words.length+"の値にしてください");
        } else {
          old_range_end = range_end.value;
          answered_number = 0;
          startquestion();
        }
      });
      option_start.addEventListener('change', (event) => {
        if (option_start.value <= 0 || option_start.value > words.length) {
          option_start.value = old_option_start;
          alert("1~"+words.length+"の値にしてください");
        } else if (option_end.value < option_start.value + 3) {
          option_start.value = old_option_start;
