<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>4択 For-LEAP</title>
    <link rel="icon" href="tubicon.png">
    <style>
      @font-face {
        font-family: "kosugi";
        src: url("Kosugi.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      body {
        background: rgb(250,250,220);
        margin: 0;
      }
      .off {
        display: none !important;
      }
      .notclick {
        pointer-events: none;
      }
      .all {
        position: relative;
        background: rgb(250,250,220);
        margin: 0 auto;
        height: 100svh;
        aspect-ratio: 5 / 8;
        max-width: 100vw;
        color: rgb(0,0,0);
      }
      .number,
      .mondai1,
      .mondai2 {
        font-family: kosugi, sans-serif;
      }
      .menu {
        position: absolute;
        left: 1%;
        top: 1%;
        width: 6%;
        aspect-ratio: 1 / 1;
      }
      .options {
        position: absolute;
        top: 28%;
        width: 100%;
        height: 70%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        
      }
      .o1,
      .o2,
      .o3,
      .o4,
      .buttons {
        display: flex;
        border: none;
        width: 94%;
        height: 18%;
        margin: 0 3%;
        justify-content: center;
        align-items: center;
        color: rgb(255,255,255);
        font-weight: 900;
        border-radius: 10px;
        font-size: 200%;
      }
      .o1,
      .o2,
      .o3,
      .o4 {
        background: rgb(120,200,120);
      }
      .buttons {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      .next,
      .miss {
        display: flex;
        border: none;
        width: 47%;
        height: 100%;
        justify-content: center;
        align-items: center;
        color: rgb(255,255,255);
        font-weight: 900;
        border-radius: 10px;
        font-size: 65%;
        background: rgb(120,200,120);
        font-family: kosugi, sans-serif;
      }
      .miss {
        background: rgb(240,180,80) !important;
      }
      .maru {
        position: absolute;
        color: red;
        font-size: 300%;
        right: 4vw;
      }
      .batu {
        position: absolute;
        color: blue;
        font-size: 350%;
        right: 3.5vw;
      }
      .change {
        width: 30px;
        height: 30px;
        background: rgb(0,0,0);
      }
      .switch1 {
        background: rgb(255,0,0);
      }
    </style>
  </head>
  <body>
    <div class="all">
      <button class="menu"></button>
      <div class="menuG off">
        <input name="menu_input" type="number" class="range_start">
        <input name="menu_input" type="number" class="range_end">
        <input name="menu_input" type="number" class="option_start">
        <input name="menu_input" type="number" class="option_end">
        <div class="change">
          <div class="changem"></div>
        </div>
        <a href="https://for-leap.pages.dev/">For-LEAP</a>
      </div>
      <div class="number"></div>
      <div class="mondai1"></div>
      <div class="mondai2"></div>
      <div class="options">
        <button class="o1">
          <div class="maru m1 off">◯</div>
          <div class="batu b1 off">×</div>
        </button>
        <button class="o2">
          <div class="maru m2 off">◯</div>
          <div class="batu b2 off">×</div>
        </button>
        <button class="o3">
          <div class="maru m3 off">◯</div>
          <div class="batu b3 off">×</div>
        </button>
        <button class="o4">
          <div class="maru m4 off">◯</div>
          <div class="batu b4 off">×</div>
        </button>
        <div class="buttons">
          <button class="next">次へ</button>
          <button class="miss off">間違えた問題を やり直す</button>
        </div>
      </div>
    </div>
    <script src="wards.js"></script>
    <script>
      const all = document.querySelector('.all');
      const range_start = document.querySelector('.range_start');
      const range_end = document.querySelector('.range_end');
      const option_start = document.querySelector('.option_start');
      const option_end = document.querySelector('.option_end');
      const number = document.querySelector('.number');
      const mondai1 = document.querySelector('.mondai1');
      const mondai2 = document.querySelector('.mondai2');
      const o1 = document.querySelector('.o1');
      const o2 = document.querySelector('.o2');
      const o3 = document.querySelector('.o3');
      const o4 = document.querySelector('.o4');
      const menu = document.querySelector('.menu');
      const menuG = document.querySelector('.menuG');
      const next = document.querySelector('.next');
      const miss = document.querySelector('.miss');
      const maru = document.querySelector('.maru');
      const m1 = document.querySelector('.m1');
      const m2 = document.querySelector('.m2');
      const m3 = document.querySelector('.m3');
      const m4 = document.querySelector('.m4');
      const batu = document.querySelector('.batu');
      const b1 = document.querySelector('.b1');
      const b2 = document.querySelector('.b2');
      const b3 = document.querySelector('.b3');
      const b4 = document.querySelector('.b4');
      const change = document.querySelector('.change');
      const changem = document.querySelector('.changem');
      let question_wards = [];
      let option_wards = [];
      let mistakes_wards = [];
      let mistakes_quantity = 0;
      let question_number = 0;
      let answer_number = 0;
      let option_number = 0;
      let question_range = 0;
      let option_range = 0;
      let o1text = "";
      let o2text = "";
      let o3text = "";
      let o4text = "";
      range_start.value = 1;
      range_end.value = 5;
      option_start.value = 1;
      option_end.value = 5;
      let old_range_start = range_start.value;
      let old_range_end = range_end.value;
      let old_option_start = option_start.value;
      let old_option_end = option_end.value;
      let change_number = 1;
      
      function setquestion() {
        question_number = Math.floor(Math.random() * question_wards.length);
        number.textContent = question_wards[question_number][0];
        if (change.classList.contains("switch1")) {
          mondai1.textContent = question_wards[question_number][1];
          mondai2.textContent = "";
        } else {
          mondai1.textContent = question_wards[question_number][2];
          mondai2.textContent = question_wards[question_number][3];
        }
        answer_number = Math.floor(Math.random() * 4);
        switch (answer_number) {
          case 0:
            o1text = question_wards[question_number][change_number];
            option_number = Math.floor(Math.random() * option_wards.length);
            o2text = option_wards[option_number][change_number];
            while (o2text === o1text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o2text = option_wards[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_wards.length);
            o3text = option_wards[option_number][change_number];
            while (o3text === o1text || o3text === o2text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o3text = option_wards[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_wards.length);
            o4text = option_wards[option_number][change_number];
            while (o4text === o1text || o4text === o2text || o4text === o3text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o4text = option_wards[option_number][change_number];
            }
            m1.classList.remove("off");
            break;
          case 1:
            o2text = question_wards[question_number][change_number];
            option_number = Math.floor(Math.random() * option_wards.length);
            o1text = option_wards[option_number][change_number];
            while (o1text === o2text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o1text = option_wards[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_wards.length);
            o3text = option_wards[option_number][change_number];
            while (o3text === o1text || o3text === o2text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o3text = option_wards[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_wards.length);
            o4text = option_wards[option_number][change_number];
            while (o4text === o1text || o4text === o2text || o4text === o3text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o4text = option_wards[option_number][change_number];
            }
            m2.classList.remove("off");
            break;
          case 2:
            o3text = question_wards[question_number][change_number];
            option_number = Math.floor(Math.random() * option_wards.length);
            o1text = option_wards[option_number][change_number];
            while (o1text === o3text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o1text = option_wards[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_wards.length);
            o2text = option_wards[option_number][change_number];
            while (o2text === o1text || o2text === o3text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o2text = option_wards[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_wards.length);
            o4text = option_wards[option_number][change_number];
            while (o4text === o1text || o4text === o2text || o4text === o3text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o4text = option_wards[option_number][change_number];
            }
            m3.classList.remove("off");
            break;
          case 3:
            o4text = question_wards[question_number][change_number];
            option_number = Math.floor(Math.random() * option_wards.length);
            o1text = option_wards[option_number][change_number];
            while (o1text === o4text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o1text = option_wards[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_wards.length);
            o2text = option_wards[option_number][change_number];
            while (o2text === o1text || o2text === o4text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o2text = option_wards[option_number][change_number];
            }
            option_number = Math.floor(Math.random() * option_wards.length);
            o3text = option_wards[option_number][change_number];
            while (o3text === o1text || o3text === o2text || o3text === o4text) {
              option_number = Math.floor(Math.random() * option_wards.length);
              o3text = option_wards[option_number][change_number];
            }
            m4.classList.remove("off");
            break;
        }
        o1.textContent = o1text;
        o2.textContent = o2text;
        o3.textContent = o3text;
        o4.textContent = o4text;
        next.classList.add("notclick");
      }
      function startquestion() {
        question_wards = [];
        option_wards = [];
        question_range = Number(range_end.value) - Number(range_start.value) + 1;
        for (let i = 0;i < question_range;i ++) {
          question_wards[i] = wards[Number(range_start.value) + i - 1];
        }
        option_range = Number(option_end.value) - Number(option_start.value) + 1;
        for (let i = 0;i < option_range;i ++) {
          option_wards[i] = wards[Number(option_start.value) + i - 1];
        }
        mistakes_wards = [];
        mistakes_quantity = 0;
        setquestion();
      }
      menu.addEventListener('click', () => {
        menuG.classList.toggle("off");
      });
      range_start.addEventListener('change', (event) => {
        if (range_start.value <= 0 || range_start.value > wards.length) {
          range_start.value = old_range_start;
          alert("1~"+wards.length+"の値にしてください");
        } else {
          old_range_start = range_start.value;
          startquestion();
        }
      });
      range_end.addEventListener('change', (event) => {
        if (range_end.value <= 0 || range_end.value > wards.length) {
          range_end.value = old_range_end;
          alert("1~"+wards.length+"の値にしてください");
        } else {
          old_range_end = range_end.value;
          startquestion();
        }
      });
      option_start.addEventListener('change', (event) => {
        if (option_start.value <= 0 || option_start.value > wards.length) {
          option_start.value = old_option_start;
          alert("1~"+wards.length+"の値にしてください");
        } else if (option_end.value < option_start.value + 3) {
          option_start.value = old_option_start;
          alert("選択肢範囲は4つ以上にしてください");
        } else {
          old_option_start = option_start.value;
          startquestion();
        }
      });
      option_end.addEventListener('change', (event) => {
        if (option_end.value <= 0 || option_end.value > wards.length) {
          option_end.value = old_option_end;
          alert("1~"+wards.length+"の値にしてください");
        } else if (option_end.value < option_start.value + 3) {
          option_start.value = old_option_start;
          alert("選択肢範囲4つ以上にしてください");
        } else {
          old_option_end = option_end.value;
          startquestion();
        }
      });
      o1.addEventListener('click', () => {
        maru.classList.remove("off");
        if (answer_number !== 0) {
          batu.style.top = "1vh";
          batu.classList.remove("off");
          mistakes_wards[mistakes_quantity] = question_wards[question_number];
          mistakes_quantity += 1;
        }
        next.classList.remove("notclick");
        o1.classList.add("notclick");
        o2.classList.add("notclick");
        o3.classList.add("notclick");
        o4.classList.add("notclick");
      });
      o2.addEventListener('click', () => {
        maru.classList.remove("off");
        if (answer_number !== 1) {
          batu.style.top = "15vh";
          batu.classList.remove("off");
          mistakes_wards[mistakes_quantity] = question_wards[question_number];
          mistakes_quantity += 1;
        }
        next.classList.remove("notclick");
        o1.classList.add("notclick");
        o2.classList.add("notclick");
        o3.classList.add("notclick");
        o4.classList.add("notclick");
      });
      o3.addEventListener('click', () => {
        maru.classList.remove("off");
        if (answer_number !== 2) {
          batu.style.top = "29.5vh";
          batu.classList.remove("off");
          mistakes_wards[mistakes_quantity] = question_wards[question_number];
          mistakes_quantity += 1;
        }
        next.classList.remove("notclick");
        o1.classList.add("notclick");
        o2.classList.add("notclick");
        o3.classList.add("notclick");
        o4.classList.add("notclick");
      });
      o4.addEventListener('click', () => {
        maru.classList.remove("off");
        if (answer_number !== 3) {
          batu.style.top = "43vh";
          batu.classList.remove("off");
          mistakes_wards[mistakes_quantity] = question_wards[question_number];
          mistakes_quantity += 1;
        }
        next.classList.remove("notclick");
        o1.classList.add("notclick");
        o2.classList.add("notclick");
        o3.classList.add("notclick");
        o4.classList.add("notclick");
      });
      next.addEventListener('click', () => {
        maru.classList.add("off");
        batu.classList.add("off");
        question_wards.splice(question_number, 1);
        if (question_wards.length === 0) {
          next.textContent = "最初から";
          if (mistakes_wards.length !== 0) {
            miss.classList.remove("off");
          }
          next.classList.remove("notclick");
          if (next.textContent === "最初から") {
            startquestion();
          }
        } else {
          next.classList.add("notclick");
          o1.classList.remove("notclick");
          o2.classList.remove("notclick");
          o3.classList.remove("notclick");
          o4.classList.remove("notclick");
          setquestion();
        }
      });
      miss.addEventListener('click', () => {
        miss.classList.add("off");
        question_wards = mistakes_wards;
        next.textContent = "次";
        mistakes_quantity = 0;
        mistakes_wards = [];
        next.classList.add("notclick");
        o1.classList.remove("notclick");
        o2.classList.remove("notclick");
        o3.classList.remove("notclick");
        o4.classList.remove("notclick");
        setquestion();
      });
      change.addEventListener('click', () => {
        change.classList.toggle("switch1");
        changem.classList.toggle("switch1");
        if (change.classList.contains("switch1")) {
          change_number = 2;
        } else {
          change_number = 1;
        }
        mistakes_quantity = 0;
        mistakes_wards = [];
        setquestion();
      });
      startquestion();
    </script>
  </body>
</html>
